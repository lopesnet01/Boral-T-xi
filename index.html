<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BORA LÁ TÁXI</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
:root { --amarelo:#FFD700; --preto:#000; --branco:#fff; }
body,html { margin:0; height:100%; font-family:Arial; }
#mapa { height:100vh; width:100vw; }

.bottom-sheet {
position: fixed;
bottom: 0;
width: 100%;
background: white;
border-radius: 20px 20px 0 0;
padding: 15px;
transform: translateY(calc(100% - 90px));
transition: .3s;
}
.bottom-sheet.aberto { transform: translateY(0); }

input, select, button {
width:100%; padding:12px; margin:6px 0;
border-radius:8px; border:1px solid #ccc;
}
.btn-whats { background:#25D366; color:white; }
</style>
</head>

<body>

<div id="mapa"></div>

<div id="bottomSheet" class="bottom-sheet">
<div onclick="toggleSheet()">⬆️ Arraste</div>

<p><b>Valor:</b> <span id="displayValor">R$ 30,00</span></p>

<input id="origem" placeholder="Origem">
<input id="destino" placeholder="Digite ou toque no mapa">

<select id="tipoTransporte" onchange="atualizarInfo()">
<option value="Carro|30.00">Carro</option>
<option value="Moto|20.00">Moto</option>
</select>

<select id="formaPagamento">
<option>Dinheiro</option>
<option>Pix</option>
</select>

<button class="btn-whats" onclick="enviarWhatsApp()">Solicitar</button>
</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Google Places (SÓ BUSCA) -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDMwKrx_KIQnaZaQkhKmj19LKVFmjVnGqE&libraries=places"></script>

<script>
let map, marcadorOrigem, marcadorDestino;

// MAPA OPENSTREETMAP
function carregarMapa() {
    map = L.map('mapa').setView([-10.7242, -43.6283], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    // localização atual
    navigator.geolocation.getCurrentPosition(pos => {
        let lat = pos.coords.latitude;
        let lng = pos.coords.longitude;

        map.setView([lat, lng], 16);

        marcadorOrigem = L.marker([lat, lng]).addTo(map);

        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
        .then(r=>r.json())
        .then(d=>{
            document.getElementById("origem").value = d.display_name;
        });
    });

    // clique mapa
    map.on('click', function(e){
        let lat = e.latlng.lat;
        let lng = e.latlng.lng;

        if(marcadorDestino) map.removeLayer(marcadorDestino);

        marcadorDestino = L.marker([lat, lng]).addTo(map);

        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
        .then(r=>r.json())
        .then(d=>{
            document.getElementById("destino").value = d.display_name;
            abrirGaveta();
        });
    });

    // GOOGLE AUTOCOMPLETE (BUSCA)
    const input = document.getElementById("destino");
    const autocomplete = new google.maps.places.Autocomplete(input);

    autocomplete.addListener("place_changed", () => {
        const place = autocomplete.getPlace();
        if (!place.geometry) return;

        let lat = place.geometry.location.lat();
        let lng = place.geometry.location.lng();

        if(marcadorDestino) map.removeLayer(marcadorDestino);

        marcadorDestino = L.marker([lat, lng]).addTo(map);

        map.setView([lat, lng], 16);

        abrirGaveta();
    });
}

// GAVETA
function toggleSheet(){
document.getElementById("bottomSheet").classList.toggle("aberto");
}
function abrirGaveta(){
document.getElementById("bottomSheet").classList.add("aberto");
}

// VALOR
function atualizarInfo(){
let v = document.getElementById("tipoTransporte").value.split("|")[1];
document.getElementById("displayValor").innerText = "R$ " + v.replace('.', ',');
}

// WHATSAPP
function enviarWhatsApp(){
let origem = document.getElementById("origem").value;
let destino = document.getElementById("destino").value;
let pagamento = document.getElementById("formaPagamento").value;
let dados = document.getElementById("tipoTransporte").value.split("|");

let msg = `🚕 BORA LÁ TÁXI\n\n📍 ${origem}\n🏁 ${destino}\n🚗 ${dados[0]}\n💵 ${pagamento}\n💰 R$ ${dados[1]}`;

window.open("https://wa.me/557798623007?text=" + encodeURIComponent(msg));
}

window.onload = carregarMapa;
</script>

</body>
</html>
