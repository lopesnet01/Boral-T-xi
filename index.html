<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BORA LÁ TÁXI</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

    <style>
        :root { --amarelo: #FFD700; --preto: #000000; --branco: #FFFFFF; --cinza: #f4f4f4; }
        html, body { height: 100%; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--branco); color: var(--preto); }
        .hidden { display: none !important; }
        .container { min-height: 100vh; display: flex; flex-direction: column; }
        
        header { background-color: var(--amarelo); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; font-weight: 900; }
        .menu-btn { background: none; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; color: var(--preto); }
        
        .form-box { padding: 20px; max-width: 400px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        input, select { width: 100%; padding: 15px; margin: 8px 0; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        
        input[readonly] { background-color: #f9f9f9; cursor: pointer; border-style: dashed; }

        button { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        
        .btn-main { background-color: var(--preto); color: var(--amarelo); }
        .btn-whats { background-color: #25D366; color: white; margin-top: 10px; font-size: 1.1rem; }
        .btn-outline { background-color: transparent; border: 2px solid var(--preto); color: var(--preto); }
        .btn-guest { background-color: var(--cinza); border: 2px solid #ccc; color: #333; margin-top: 20px; }
        
        .info-box { background: var(--cinza); padding: 15px; text-align: center; border-bottom: 2px solid var(--amarelo); font-size: 0.9rem; }
        
        #mapa { height: 250px; width: 100%; border-radius: 8px; margin-bottom: 10px; border: 2px solid #ccc; z-index: 1; }
        
        .lgpd-box { font-size: 0.8rem; color: #555; display: flex; align-items: flex-start; gap: 8px; margin: 10px 0; text-align: left; }
        .lgpd-box input { width: auto; margin: 2px 0 0 0; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--amarelo); padding-bottom: 10px; margin-bottom: 20px; }
        
        .qr-container { text-align: center; margin-top: 20px; }
        .qr-container img { max-width: 200px; border-radius: 10px; border: 4px solid var(--amarelo); }
    </style>
</head>
<body>

    <div id="auth-section" class="container">
        <header style="justify-content: center;"><h1>BORA LÁ TÁXI</h1></header>
        <div class="form-box">
            <h2 id="form-title">Login</h2>
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="password" placeholder="Senha">
            <input type="text" id="nomeCadastro" placeholder="Seu Nome Completo" class="hidden">
            
            <div id="lgpd-container" class="lgpd-box hidden">
                <input type="checkbox" id="aceiteLGPD">
                <label for="aceiteLGPD">Concordo com os Termos de Uso. Meus dados serão usados apenas para solicitar a corrida.</label>
            </div>
            
            <button class="btn-main" onclick="handleAuth()">Entrar</button>
            <p style="text-align:center; margin-top: 15px;">
                <a href="#" onclick="toggleMode()" id="toggle-text">Criar conta</a>
            </p>

            <hr style="border: 1px solid #ddd; margin: 20px 0;">
            
            <button class="btn-guest" onclick="entrarComoConvidado()">Entrar como Convidado</button>
        </div>
    </div>

    <div id="app-section" class="container hidden">
        <header>
            <h1>BORA LÁ TÁXI</h1>
            <div>
                <button class="menu-btn" onclick="abrirPerfil()">👤 Perfil</button>
            </div>
        </header>
        
        <div class="info-box">
            <p style="margin: 0 0 5px 0;"><strong>Valor Estimado:</strong> <span id="displayValor" style="color: #25D366; font-weight: bold; font-size: 1.1rem;">Aguardando locais...</span></p>
        </div>

        <div class="form-box">
            <div id="mapa"></div>

            <label style="font-size: 0.85rem; font-weight: bold;">📍 Partida:</label>
            <input type="text" id="origem" placeholder="Buscando sua localização...">
            
            <label style="font-size: 0.85rem; font-weight: bold;">🏁 Destino:</label>
            <input type="text" id="destino" placeholder="Toque no mapa ou use a lupa 🔍" readonly>
            
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label style="font-size: 0.85rem; font-weight: bold;">🚗 Veículo:</label>
                    <select id="tipoTransporte" onchange="calcularPreco()">
                        <option value="Carro|10.00">Carro (R$ 10/km)</option>
                        <option value="Moto|6.70">Moto (R$ 6,70/km)</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 0.85rem; font-weight: bold;">💵 Pagamento:</label>
                    <select id="formaPagamento">
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Pix">Pix (Falar com Motorista)</option>
                    </select>
                </div>
            </div>
            
            <button class="btn-whats" onclick="enviarWhatsApp()">Pedir BORA LÁ TÁXI</button>
        </div>
    </div>

    <div id="perfil-section" class="modal hidden">
        <div class="modal-header">
            <h2>Minha Conta</h2>
            <button class="menu-btn" onclick="fecharPerfil()">❌ Fechar</button>
        </div>
        
        <label>Nome Completo:</label>
        <input type="text" id="perfilNome" placeholder="Seu nome">
        
        <label>Telefone (Opcional):</label>
        <input type="tel" id="perfilTelefone" placeholder="(77) 90000-0000">
        
        <button class="btn-main" onclick="salvarPerfil()">Salvar Dados</button>
        <button class="btn-outline" onclick="abrirCompartilhar()" style="margin-top: 15px;">📲 Compartilhar App</button>
        <button class="btn-outline" onclick="logout()" style="margin-top: 15px; color: red; border-color: red;">Sair da Conta</button>
    </div>

    <div id="share-section" class="modal hidden">
        <div class="modal-header">
            <h2>Indique o BORA LÁ!</h2>
            <button class="menu-btn" onclick="fecharCompartilhar()">❌ Fechar</button>
        </div>
        <div class="qr-container">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://boralataxi.netlify.app/" alt="QR Code BORA LÁ TÁXI">
            <h3 style="margin-top: 15px;">BORA LÁ TÁXI</h3>
            <p style="font-weight: bold; color: var(--amarelo); text-shadow: 1px 1px 2px black;">Rápido. Seguro. Na palma da mão.</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmFpfWNzOHeWBap4l_G4yU-Aiw2S5ahGc",
            authDomain: "basetaxicar-822e2.firebaseapp.com",
            projectId: "basetaxicar-822e2",
            storageBucket: "basetaxicar-822e2.firebasestorage.app",
            messagingSenderId: "848040258238",
            appId: "1:848040258238:web:c4cafdd11d459a20498cef",
            measurementId: "G-QX9Q6Y7L16"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isGuest = false;
        let isLogin = true;
        let valorCalculadoStr = "0,00";
        let distanciaCalculadaKm = "0.0";
        let map, marcadorOrigem, marcadorDestino;

        function formatarEnderecoCurto(addressObj) {
            if (!addressObj) return "";
            let partes = [];
            if (addressObj.amenity) partes.push(addressObj.amenity);
            if (addressObj.road) partes.push(addressObj.road);
            if (addressObj.suburb || addressObj.neighbourhood) partes.push(addressObj.suburb || addressObj.neighbourhood);
            return partes.length > 0 ? partes.join(", ") : "Local selecionado";
        }

        // --- FUNÇÃO DE CÁLCULO DE PREÇO COM TAXAS MÍNIMAS INTEGRADAS ---
        window.calcularPreco = async () => {
            if (!marcadorOrigem || !marcadorDestino) {
                document.getElementById('displayValor').innerText = "Aguardando locais...";
                return;
            }

            document.getElementById('displayValor').innerText = "Calculando rota...";

            const origem = marcadorOrigem.getLatLng();
            const destino = marcadorDestino.getLatLng();
            const dadosTransporte = document.getElementById('tipoTransporte').value.split('|');
            const tipoVeiculo = dadosTransporte[0];
            const taxaPorKm = parseFloat(dadosTransporte[1]);

            // Valores mínimos configurados
            const valorMinimo = (tipoVeiculo === "Carro") ? 10.00 : 8.00;

            try {
                const resposta = await fetch(`https://router.project-osrm.org/route/v1/driving/${origem.lng},${origem.lat};${destino.lng},${destino.lat}?overview=false`);
                const dadosRota = await resposta.json();

                if (dadosRota.routes && dadosRota.routes.length > 0) {
                    const distanciaMetros = dadosRota.routes[0].distance;
                    const distanciaKm = distanciaMetros / 1000;
                    
                    let valorTotal = distanciaKm * taxaPorKm;
                    
                    // Verificação de Taxa Mínima
                    if (valorTotal < valorMinimo) {
                        valorTotal = valorMinimo;
                    }
                    
                    distanciaCalculadaKm = distanciaKm.toFixed(1);
                    valorCalculadoStr = valorTotal.toFixed(2).replace('.', ',');
                    
                    document.getElementById('displayValor').innerText = `R$ ${valorCalculadoStr} (${distanciaCalculadaKm} km)`;
                } else {
                    document.getElementById('displayValor').innerText = "Rota não encontrada";
                }
            } catch (error) {
                console.error("Erro na API de rotas", error);
                const distLinhaReta = origem.distanceTo(destino) / 1000;
                let valorFallback = distLinhaReta * taxaPorKm;
                if (valorFallback < valorMinimo) valorFallback = valorMinimo;
                
                distanciaCalculadaKm = distLinhaReta.toFixed(1);
                valorCalculadoStr = valorFallback.toFixed(2).replace('.', ',');
                document.getElementById('displayValor').innerText = `R$ ${valorCalculadoStr} (~${distanciaCalculadaKm} km)`;
            }
        };

        function carregarMapa() {
            if (!map) {
                map = L.map('mapa').setView([-10.7242, -43.6283], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

                const geocoder = L.Control.Geocoder.nominatim({
                    geocodingQueryParams: { viewbox: '-43.70,-10.80,-43.50,-10.60', bounded: 1 }
                });

                L.Control.geocoder({ geocoder: geocoder, defaultMarkGeocode: false, placeholder: "BORA LÁ Onde?" })
                .on('markgeocode', function(e) {
                    const latlng = e.geocode.center;
                    if(marcadorDestino) map.removeLayer(marcadorDestino);
                    marcadorDestino = L.marker(latlng).addTo(map).bindPopup("Destino").openPopup();
                    map.setView(latlng, 16);
                    document.getElementById('destino').value = e.geocode.name.split(',')[0] + ", Buritirama";
                    calcularPreco();
                }).addTo(map);

                map.on('click', function(e) {
                    const lat = e.latlng.lat;
                    const lng = e.latlng.lng;
                    if(marcadorDestino) map.removeLayer(marcadorDestino);
                    marcadorDestino = L.marker([lat, lng]).addTo(map).bindPopup("Destino selecionado").openPopup();
                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
                        .then(res => res.json())
                        .then(data => { 
                            document.getElementById('destino').value = formatarEnderecoCurto(data.address) + ", Buritirama"; 
                            calcularPreco();
                        });
                });
            }
            setTimeout(() => { map.invalidateSize(); }, 300);
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude; const lng = position.coords.longitude;
                    map.setView([lat, lng], 16);
                    if (marcadorOrigem) map.removeLayer(marcadorOrigem);
                    marcadorOrigem = L.marker([lat, lng]).addTo(map).bindPopup('Sua Localização').openPopup();
                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
                        .then(res => res.json())
                        .then(data => { 
                            document.getElementById('origem').value = formatarEnderecoCurto(data.address);
                            calcularPreco();
                        });
                });
            }
        }

        window.toggleMode = () => {
            isLogin = !isLogin;
            document.getElementById('form-title').innerText = isLogin ? "Login" : "Cadastro";
            document.getElementById('toggle-text').innerText = isLogin ? "Já tenho conta" : "Criar conta";
            document.getElementById('nomeCadastro').classList.toggle('hidden', isLogin);
            document.getElementById('lgpd-container').classList.toggle('hidden', isLogin);
        };

        window.handleAuth = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const nome = document.getElementById('nomeCadastro').value;
            const aceite = document.getElementById('aceiteLGPD').checked;
            try {
                if(isLogin) { await signInWithEmailAndPassword(auth, email, pass); } 
                else {
                    if(!aceite) { alert("Aceite os termos LGPD."); return; }
                    const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                    await updateProfile(userCredential.user, { displayName: nome });
                }
            } catch (e) { alert("Erro: " + e.message); }
        };

        window.entrarComoConvidado = () => {
            let nomeExistente = localStorage.getItem('guestNome');
            if (!nomeExistente) {
                let nomePrompt = prompt("Como gostaria de ser chamado?");
                if (!nomePrompt || nomePrompt.trim() === "") return;
                localStorage.setItem('guestNome', nomePrompt);
                nomeExistente = nomePrompt;
            }
            isGuest = true;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('perfilNome').value = nomeExistente;
            carregarMapa();
        };

        window.logout = () => {
            isGuest = false;
            signOut(auth).then(() => {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            });
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                isGuest = false;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('perfilNome').value = user.displayName || "";
                carregarMapa();
            } else if (!isGuest) {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        });

        window.abrirPerfil = () => document.getElementById('perfil-section').classList.remove('hidden');
        window.fecharPerfil = () => document.getElementById('perfil-section').classList.add('hidden');
        
        window.salvarPerfil = async () => {
            const novoNome = document.getElementById('perfilNome').value;
            const novoTelefone = document.getElementById('perfilTelefone').value;
            localStorage.setItem('userTelefone', novoTelefone);
            if (isGuest) {
                localStorage.setItem('guestNome', novoNome);
                alert("Dados salvos!");
                fecharPerfil();
            } else {
                const user = auth.currentUser;
                if (user) {
                    await updateProfile(user, { displayName: novoNome });
                    alert("Perfil atualizado!");
                    fecharPerfil();
                }
            }
        };

        window.abrirCompartilhar = () => document.getElementById('share-section').classList.remove('hidden');
        window.fecharCompartilhar = () => document.getElementById('share-section').classList.add('hidden');

        window.enviarWhatsApp = () => {
            var nome = document.getElementById('perfilNome').value || "Passageiro";
            var origem = document.getElementById('origem').value;
            var destino = document.getElementById('destino').value;
            var pagamento = document.getElementById('formaPagamento').value;
            var dadosTransporte = document.getElementById('tipoTransporte').value.split('|');
            
            if (destino === "" || destino.includes("Toque")) { alert("Selecione o destino."); return; }
            if (valorCalculadoStr === "0,00") { alert("Aguarde o cálculo."); return; }

            var mensagem = `*Nova Corrida - BORA LÁ TÁXI* 🚕\n\n👤 *Passageiro:* ${nome}\n📍 *Origem:* ${origem}\n🏁 *Destino:* ${destino}\n🛣️ *Distância:* ${distanciaCalculadaKm} km\n🚗 *Veículo:* ${dadosTransporte[0]}\n💵 *Pagamento:* ${pagamento}\n💰 *Valor Calculado:* R$ ${valorCalculadoStr}`;
            window.open("https://wa.me/557798623007?text=" + encodeURIComponent(mensagem), '_blank');
        };
    </script>
</body>
</html>
