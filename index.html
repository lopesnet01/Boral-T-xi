<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BORA LÁ TÁXI</title>

<style>
:root { --amarelo: #FFD700; --preto: #000000; --branco: #FFFFFF; --cinza: #f4f4f4; }
html, body { height: 100%; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
.hidden { display: none !important; }

header { position: absolute; top: 0; left: 0; width: 100%; z-index: 1000; background: rgba(255,215,0,0.95); padding: 15px; display: flex; justify-content: space-between; }
h1 { margin: 0; font-size: 1.3rem; }

#mapa { position: absolute; width: 100vw; height: 100vh; }

.bottom-sheet {
position: fixed; bottom: 0; width: 100%; background: #fff;
border-radius: 20px 20px 0 0; padding: 15px;
transform: translateY(calc(100% - 90px));
transition: 0.3s;
}
.bottom-sheet.aberto { transform: translateY(0); }

input, select, button {
width: 100%; padding: 12px; margin: 6px 0;
border-radius: 8px; border: 1px solid #ccc;
}
.btn-main { background: black; color: yellow; }
.btn-whats { background: #25D366; color: white; }
</style>
</head>

<body>

<header>
<h1>BORA LÁ TÁXI</h1>
</header>

<div id="mapa"></div>

<div id="bottomSheet" class="bottom-sheet">
<div onclick="toggleSheet()">⬆️ Arraste</div>

<p><b>Valor:</b> <span id="displayValor">R$ 30,00</span></p>

<input id="origem" placeholder="Origem">
<input id="destino" placeholder="Destino">

<select id="tipoTransporte" onchange="atualizarInfo()">
<option value="Carro|30.00">Carro</option>
<option value="Moto|20.00">Moto</option>
</select>

<select id="formaPagamento">
<option>Dinheiro</option>
<option>Pix</option>
</select>

<button class="btn-whats" onclick="enviarWhatsApp()">Solicitar</button>
</div>

<!-- GOOGLE MAPS -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDMwKrx_KIQnaZaQkhKmj19LKVFmjVnGqE&libraries=places"></script>

<script>
let map, marcadorOrigem, marcadorDestino, geocoder;

function carregarMapa() {
    geocoder = new google.maps.Geocoder();

    map = new google.maps.Map(document.getElementById("mapa"), {
        center: { lat: -10.7242, lng: -43.6283 },
        zoom: 15
    });

    // localização atual
    navigator.geolocation.getCurrentPosition((pos) => {
        const p = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        map.setCenter(p);

        marcadorOrigem = new google.maps.Marker({
            position: p,
            map: map
        });

        geocoder.geocode({ location: p }, (res, status) => {
            if (status === "OK") {
                document.getElementById("origem").value = res[0].formatted_address;
            }
        });
    });

    // clique mapa
    map.addListener("click", (e) => {
        if (marcadorDestino) marcadorDestino.setMap(null);

        marcadorDestino = new google.maps.Marker({
            position: e.latLng,
            map: map
        });

        geocoder.geocode({ location: e.latLng }, (res, status) => {
            if (status === "OK") {
                document.getElementById("destino").value = res[0].formatted_address;
                abrirGaveta();
            }
        });
    });

    // autocomplete
    const input = document.getElementById("destino");
    const auto = new google.maps.places.Autocomplete(input);

    auto.addListener("place_changed", () => {
        const place = auto.getPlace();
        if (!place.geometry) return;

        if (marcadorDestino) marcadorDestino.setMap(null);

        marcadorDestino = new google.maps.Marker({
            position: place.geometry.location,
            map: map
        });

        map.setCenter(place.geometry.location);
        map.setZoom(16);

        abrirGaveta();
    });
}

function toggleSheet() {
    document.getElementById("bottomSheet").classList.toggle("aberto");
}
function abrirGaveta() {
    document.getElementById("bottomSheet").classList.add("aberto");
}

function atualizarInfo() {
    let v = document.getElementById("tipoTransporte").value.split("|")[1];
    document.getElementById("displayValor").innerText = "R$ " + v.replace('.', ',');
}

function enviarWhatsApp() {
    let origem = document.getElementById("origem").value;
    let destino = document.getElementById("destino").value;
    let pagamento = document.getElementById("formaPagamento").value;
    let dados = document.getElementById("tipoTransporte").value.split("|");

    let msg = `🚕 BORA LÁ TÁXI\n\n📍 ${origem}\n🏁 ${destino}\n🚗 ${dados[0]}\n💵 ${pagamento}\n💰 R$ ${dados[1]}`;

    window.open("https://wa.me/557798623007?text=" + encodeURIComponent(msg));
}

window.onload = carregarMapa;
</script>

</body>
</html>
